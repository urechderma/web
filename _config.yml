title: Dra. Marta Urech
description: Dermatología clínica y estética en Madrid y asesoría científica para la industria farmacéutica y biotecnológica.
lang: es
url: "https://www.urechderma.com"
baseurl: ""

contacto:
  telefono: "+34 914 31 78 61"
  telefono_enlace: "+34914317861"
  citas_url: "https://grupopedrojaen.com/contacto-citas/"
  email_web: contactoweb@urechderma.com
  email_industria: industria@urechderma.com
  direccion: Calle Serrano 143, Madrid
  mapa_url: "https://www.google.com/maps/search/?api=1&query=Grupo+Pedro+Jaen+Serrano+143+Madrid"

plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: blog/feed.xml

# Idioma de cada página según su carpeta: raíz = español, en/, fr/, it/.
# El menú y los textos comunes están en _data/i18n.yml; los de cada página, en _data/paginas/.
defaults:
  - scope:
      path: ""
    values:
      lang: es
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "fr"
    values:
      lang: fr
  - scope:
      path: "it"
    values:
      lang: it
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: es
      permalink: /blog/:title/

exclude:
  - README.md
