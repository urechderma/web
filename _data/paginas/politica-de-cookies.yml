es:
  titulo: Política de cookies
  eyebrow: Información legal
  cuerpo: |
    <h2>1. ¿Qué es una cookie?</h2>
    <p>Una cookie es un pequeño archivo de texto que se almacena en su navegador cuando visita casi cualquier página web. Su utilidad es que la web sea capaz de recordar su visita cuando vuelva a navegar por esa página, permitiendo una experiencia más personalizada y funcional.</p>
    <h2>2. Cookies utilizadas en este sitio web</h2>
    <p>Este sitio web no utiliza cookies propias ni de terceros, ni herramientas de análisis o publicidad. Las tipografías se sirven desde el propio sitio y los mapas se abren mediante un enlace externo, por lo que no se instala ninguna cookie al navegar por estas páginas.</p>
    <p>Si desde esta web accede a sitios de terceros (por ejemplo, la plataforma de citas de Grupo Pedro Jaén o Google Maps), dichos sitios pueden utilizar sus propias cookies, que se rigen por sus respectivas políticas.</p>
    <h2>3. Configuración y desactivación de cookies</h2>
    <p>Puede permitir, bloquear o eliminar las cookies instaladas en su equipo mediante la configuración de las opciones del navegador instalado en su ordenador o dispositivo móvil:</p>
    <ul>
      <li><strong>Google Chrome:</strong> Configuración &gt; Privacidad y seguridad &gt; Cookies y otros datos de sitios.</li>
      <li><strong>Safari:</strong> Preferencias &gt; Privacidad.</li>
      <li><strong>Mozilla Firefox:</strong> Opciones &gt; Privacidad y Seguridad.</li>
      <li><strong>Microsoft Edge:</strong> Configuración &gt; Permisos del sitio &gt; Cookies y datos del sitio.</li>
    </ul>
    <h2>4. Actualizaciones y cambios en la política de cookies</h2>
    <p>La titular del sitio web puede modificar esta Política de Cookies en función de exigencias legislativas, reglamentarias, o con la finalidad de adaptar dicha política a las instrucciones dictadas por la Agencia Española de Protección de Datos (AEPD). Se aconseja a los usuarios que la visiten periódicamente.</p>
    <p class="muted">Última actualización: octubre 2026.</p>

en:
  titulo: Cookie policy
  eyebrow: Legal information
  cuerpo: |
    <h2>1. What is a cookie?</h2>
    <p>A cookie is a small text file stored in your browser when you visit almost any website. It allows the website to remember your visit when you come back, providing a more personalised and functional experience.</p>
    <h2>2. Cookies used on this website</h2>
    <p>This website does not use its own or third-party cookies, nor any analytics or advertising tools. Fonts are served from the website itself and maps open through an external link, so no cookies are set while you browse these pages.</p>
    <p>If you follow a link from this website to a third-party site (for example, the Grupo Pedro Jaén booking platform or Google Maps), that site may use its own cookies, which are governed by its own policies.</p>
    <h2>3. Managing and disabling cookies</h2>
    <p>You can allow, block or delete cookies on your device through your browser settings on your computer or mobile device:</p>
    <ul>
      <li><strong>Google Chrome:</strong> Settings &gt; Privacy and security &gt; Cookies and other site data.</li>
      <li><strong>Safari:</strong> Preferences &gt; Privacy.</li>
      <li><strong>Mozilla Firefox:</strong> Options &gt; Privacy &amp; Security.</li>
      <li><strong>Microsoft Edge:</strong> Settings &gt; Site permissions &gt; Cookies and site data.</li>
    </ul>
    <h2>4. Updates and changes to this cookie policy</h2>
    <p>The website owner may amend this Cookie Policy in line with legislative or regulatory requirements, or to adapt it to instructions issued by the Spanish Data Protection Agency (AEPD). Users are advised to check it periodically.</p>
    <p class="muted">Last updated: October 2026.</p>

fr:
  titulo: Politique de cookies
  eyebrow: Informations légales
  cuerpo: |
    <h2>1. Qu’est-ce qu’un cookie ?</h2>
    <p>Un cookie est un petit fichier texte enregistré dans votre navigateur lorsque vous visitez presque n’importe quel site web. Il permet au site de se souvenir de votre visite lorsque vous y revenez, pour une expérience plus personnalisée et fonctionnelle.</p>
    <h2>2. Cookies utilisés sur ce site</h2>
    <p>Ce site n’utilise ni cookies propres ni cookies tiers, ni outils d’analyse ou de publicité. Les polices sont servies depuis le site lui-même et les cartes s’ouvrent via un lien externe : aucun cookie n’est donc déposé lors de votre navigation sur ces pages.</p>
    <p>Si vous accédez depuis ce site à des sites tiers (par exemple la plateforme de rendez-vous du Grupo Pedro Jaén ou Google Maps), ceux-ci peuvent utiliser leurs propres cookies, régis par leurs politiques respectives.</p>
    <h2>3. Paramétrage et désactivation des cookies</h2>
    <p>Vous pouvez autoriser, bloquer ou supprimer les cookies installés sur votre appareil via les paramètres de votre navigateur, sur ordinateur ou mobile :</p>
    <ul>
      <li><strong>Google Chrome :</strong> Paramètres &gt; Confidentialité et sécurité &gt; Cookies et autres données des sites.</li>
      <li><strong>Safari :</strong> Préférences &gt; Confidentialité.</li>
      <li><strong>Mozilla Firefox :</strong> Options &gt; Vie privée et sécurité.</li>
      <li><strong>Microsoft Edge :</strong> Paramètres &gt; Autorisations de site &gt; Cookies et données de site.</li>
    </ul>
    <h2>4. Mises à jour de la politique de cookies</h2>
    <p>La titulaire du site peut modifier la présente Politique de cookies en fonction d’exigences législatives ou réglementaires, ou afin de l’adapter aux instructions de l’Agence espagnole de protection des données (AEPD). Nous conseillons de la consulter régulièrement.</p>
    <p class="muted">Dernière mise à jour : octobre 2026.</p>

it:
  titulo: Cookie policy
  eyebrow: Informazioni legali
  cuerpo: |
    <h2>1. Che cos’è un cookie?</h2>
    <p>Un cookie è un piccolo file di testo che viene salvato nel browser quando si visita quasi qualsiasi sito web. Serve al sito per ricordare la visita quando si torna a navigarlo, offrendo un’esperienza più personalizzata e funzionale.</p>
    <h2>2. Cookie utilizzati su questo sito</h2>
    <p>Questo sito non utilizza cookie propri né di terze parti, né strumenti di analisi o pubblicità. I caratteri tipografici sono serviti dal sito stesso e le mappe si aprono tramite un link esterno, quindi durante la navigazione non viene installato alcun cookie.</p>
    <p>Se da questo sito si accede a siti di terzi (ad esempio la piattaforma di prenotazione del Grupo Pedro Jaén o Google Maps), tali siti possono utilizzare i propri cookie, regolati dalle rispettive informative.</p>
    <h2>3. Gestione e disattivazione dei cookie</h2>
    <p>È possibile consentire, bloccare o eliminare i cookie installati sul proprio dispositivo tramite le impostazioni del browser, su computer o dispositivo mobile:</p>
    <ul>
      <li><strong>Google Chrome:</strong> Impostazioni &gt; Privacy e sicurezza &gt; Cookie e altri dati dei siti.</li>
      <li><strong>Safari:</strong> Preferenze &gt; Privacy.</li>
      <li><strong>Mozilla Firefox:</strong> Opzioni &gt; Privacy e sicurezza.</li>
      <li><strong>Microsoft Edge:</strong> Impostazioni &gt; Autorizzazioni sito &gt; Cookie e dati del sito.</li>
    </ul>
    <h2>4. Aggiornamenti della cookie policy</h2>
    <p>La titolare del sito può modificare la presente Cookie Policy in base a requisiti legislativi o regolamentari, o per adeguarla alle indicazioni dell’Agenzia spagnola per la protezione dei dati (AEPD). Si consiglia di consultarla periodicamente.</p>
    <p class="muted">Ultimo aggiornamento: ottobre 2026.</p>
