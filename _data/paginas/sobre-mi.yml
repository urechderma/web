es:
  titulo: Sobre mí
  descripcion: Trayectoria de la Dra. Marta Urech, dermatóloga en Madrid con experiencia clínica y en Medical Affairs en la industria farmacéutica.
  eyebrow: Sobre mí
  h1: Trayectoria profesional
  lead: Médico especialista en Dermatología con trayectoria mixta en atención clínica (pública y privada) y liderazgo médico en la industria farmacéutica (Medical Affairs).
  intro: Amplia experiencia en estrategia médica, investigación clínica, desarrollo de producto y medicina basada en la evidencia.
  foto_alt: La Dra. Marta Urech
  clinica_eyebrow: Experiencia
  clinica_titulo: Clínica y docencia
  clinica:
    - { fecha: Mayo 2026 – actualidad, titulo: Dermatóloga · Práctica privada, texto: Grupo Pedro Jaén. Dermatología clínica y estética. }
    - { fecha: Práctica pública, titulo: Dermatóloga, texto: "Hospital Universitario Ramón y Cajal, Madrid." }
    - { fecha: "2014 – 2021", titulo: Docencia médica, texto: "Coordinadora y profesora de Dermatología en ProMIR Academy (2016–2021) y CTO Academy (2014–2016)." }
    - { fecha: "2015 – 2016", titulo: Unidad de Dermatología Ginecológica, texto: Creación e implantación de la unidad en el Hospital Universitario Madrid Montepríncipe. }
    - { fecha: "2011 – 2015", titulo: Especialización MIR y Jefa de Residentes, texto: "Hospital Universitario Ramón y Cajal, Madrid. Vicepresidenta de la Comisión de Docencia del hospital y coordinadora de rotaciones y formación." }
  industria_eyebrow: Industria farmacéutica
  industria_titulo: Roche Farma España
  industria:
    - { titulo: Oncology Medical Affairs Lead & Breast Cancer Area Lead, texto: Liderazgo del equipo Medical Affairs en Oncología en España. Definición de la estrategia médica nacional, ensayos clínicos y lanzamientos de terapias innovadoras. }
    - { titulo: Therapeutic Area Lead · Ophthalmology, texto: Coordinación del equipo médico experto e implantación de nuevo rol para el primer dispositivo médico en la división. Estrategia de prelanzamiento y lanzamiento nacional de terapias avanzadas. }
    - { titulo: "Disease Area Leader · Inmunología, Enfermedades Autoinmunes, Oftalmología", texto: Dirección estratégica y presupuestaria de proyectos médicos y equipos nacionales de MSLs/Medical Managers. }
    - { titulo: Medical Manager · Hemofilia y Cáncer de Piel, texto: Coordinación médica nacional de lanzamientos. Diseño e implementación de ensayos clínicos locales y supervisión de estudios promovidos por investigadores. }
  formacion_eyebrow: Formación
  formacion_titulo: Formación académica
  formacion:
    - Máster en Dermatología Estética · Universidad de Alcalá, Madrid.
    - Médico Especialista en Dermatología Médico-Quirúrgica y Venereología · Hospital Universitario Ramón y Cajal.
    - Licenciatura en Medicina · Universidad Autónoma de Madrid.
    - Curso en Inmunología e Inmunoterapia del Cáncer · Universidad de Zaragoza.
  idiomas_titulo: Idiomas
  idiomas:
    - { idioma: Español, nivel: Nativo }
    - { idioma: Francés, nivel: Bilingüe (Baccalauréat national) }
    - { idioma: Inglés, nivel: Competencia profesional }
    - { idioma: Italiano, nivel: "Fluido (B2, EOI Madrid)" }

en:
  titulo: About me
  descripcion: Career of Dr. Marta Urech, dermatologist in Madrid with clinical experience and a background in Medical Affairs in the pharmaceutical industry.
  eyebrow: About me
  h1: Professional background
  lead: Board-certified dermatologist with a combined career in clinical care (public and private) and medical leadership in the pharmaceutical industry (Medical Affairs).
  intro: Extensive experience in medical strategy, clinical research, product development and evidence-based medicine.
  foto_alt: Dr. Marta Urech
  clinica_eyebrow: Experience
  clinica_titulo: Clinical practice and teaching
  clinica:
    - { fecha: May 2026 – present, titulo: Dermatologist · Private practice, texto: Grupo Pedro Jaén. Medical and aesthetic dermatology. }
    - { fecha: Public healthcare, titulo: Dermatologist, texto: "Ramón y Cajal University Hospital, Madrid." }
    - { fecha: "2014 – 2021", titulo: Medical teaching, texto: "Dermatology coordinator and lecturer at ProMIR Academy (2016–2021) and CTO Academy (2014–2016)." }
    - { fecha: "2015 – 2016", titulo: Gynaecological Dermatology Unit, texto: Set up and launched the unit at Madrid Montepríncipe University Hospital. }
    - { fecha: "2011 – 2015", titulo: Dermatology residency and Chief Resident, texto: "Ramón y Cajal University Hospital, Madrid. Vice-chair of the hospital’s Teaching Committee and coordinator of rotations and training." }
  industria_eyebrow: Pharmaceutical industry
  industria_titulo: Roche Spain
  industria:
    - { titulo: Oncology Medical Affairs Lead & Breast Cancer Area Lead, texto: Led the Oncology Medical Affairs team in Spain. Defined the national medical strategy, clinical trials and launches of innovative therapies. }
    - { titulo: Therapeutic Area Lead · Ophthalmology, texto: Coordinated the expert medical team and introduced a new role for the division’s first medical device. Pre-launch strategy and national launch of advanced therapies. }
    - { titulo: "Disease Area Leader · Immunology, Autoimmune Diseases, Ophthalmology", texto: Strategic and budget management of medical projects and national teams of MSLs/Medical Managers. }
    - { titulo: Medical Manager · Haemophilia and Skin Cancer, texto: National medical coordination of launches. Design and implementation of local clinical trials and oversight of investigator-initiated studies. }
  formacion_eyebrow: Education
  formacion_titulo: Academic background
  formacion:
    - Master’s degree in Aesthetic Dermatology · University of Alcalá, Madrid.
    - Specialist in Medical and Surgical Dermatology and Venereology · Ramón y Cajal University Hospital.
    - Degree in Medicine · Autonomous University of Madrid.
    - Course in Cancer Immunology and Immunotherapy · University of Zaragoza.
  idiomas_titulo: Languages
  idiomas:
    - { idioma: Spanish, nivel: Native }
    - { idioma: French, nivel: Bilingual (French Baccalauréat) }
    - { idioma: English, nivel: Full professional proficiency }
    - { idioma: Italian, nivel: "Fluent (B2, EOI Madrid)" }

