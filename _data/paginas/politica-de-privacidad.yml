es:
  titulo: Política de privacidad
  eyebrow: Información legal
  cuerpo: |
    <h2>1. Responsable del tratamiento</h2>
    <ul>
      <li><strong>Titular:</strong> Dra. Marta Urech García de la Vega.</li>
      <li><strong>Domicilio profesional:</strong> Calle Serrano 143, Madrid.</li>
      <li><strong>Correo electrónico de contacto:</strong> <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</li>
    </ul>
    <h2>2. Finalidad del tratamiento de los datos</h2>
    <p>Los datos personales facilitados a través de los formularios de contacto, correo electrónico o llamadas telefónicas se tratarán para las siguientes finalidades:</p>
    <ul>
      <li><strong>Consultas médicas / Pacientes:</strong> gestionar la atención de solicitudes de información, cita previa y el posterior seguimiento clínico en la consulta privada.</li>
      <li><strong>Servicios de consultoría / B2B:</strong> atender propuestas de colaboración, servicios de asesoría científica, advisory boards o proyectos de investigación para empresas del sector farmacéutico y biotecnológico.</li>
    </ul>
    <h2>3. Legitimación para el tratamiento</h2>
    <p>La base legal para el tratamiento de sus datos es:</p>
    <ul>
      <li>El consentimiento explícito del usuario al enviar su consulta a través del correo electrónico o formulario de contacto.</li>
      <li>La ejecución de un contrato o precontrato para la prestación de servicios médicos o de consultoría.</li>
    </ul>
    <h2>4. Conservación de los datos</h2>
    <p>Los datos personales se conservarán durante el tiempo estrictamente necesario para cumplir con la finalidad para la que fueron recabados y para determinar las posibles responsabilidades que se pudieran derivar de dicha finalidad. Los datos relativos a historias clínicas se conservarán según los plazos legalmente estipulados por la normativa sanitaria.</p>
    <h2>5. Comunicación de datos a terceros</h2>
    <p>No se cederán datos personales a terceros, salvo obligación legal o cuando sea imprescindible para la correcta prestación del servicio (por ejemplo, plataformas de gestión de citas online o laboratorios de análisis clínico con su previo consentimiento).</p>
    <h2>6. Derechos del usuario</h2>
    <p>Cualquier persona tiene derecho a obtener confirmación sobre si se están tratando datos personales que le conciernan. Puede ejercitar sus derechos de:</p>
    <ul>
      <li>Acceso, rectificación y supresión de sus datos.</li>
      <li>Limitación u oposición a su tratamiento.</li>
      <li>Portabilidad de los datos.</li>
    </ul>
    <p>Para ejercitar estos derechos, puede enviar una solicitud por escrito acompañada de una copia de su documento de identidad a la dirección de correo electrónico: <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</p>
    <p>Asimismo, tiene derecho a presentar una reclamación ante la Agencia Española de Protección de Datos (AEPD) en <a href="https://www.aepd.es/" target="_blank" rel="noopener">www.aepd.es</a> si considera que el tratamiento no se ajusta a la normativa vigente.</p>

en:
  titulo: Privacy policy
  eyebrow: Legal information
  cuerpo: |
    <h2>1. Data controller</h2>
    <ul>
      <li><strong>Controller:</strong> Dr. Marta Urech García de la Vega.</li>
      <li><strong>Professional address:</strong> Calle Serrano 143, Madrid (Spain).</li>
      <li><strong>Contact email:</strong> <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</li>
    </ul>
    <h2>2. Purposes of processing</h2>
    <p>Personal data provided through contact forms, email or telephone calls will be processed for the following purposes:</p>
    <ul>
      <li><strong>Medical consultations / Patients:</strong> handling requests for information and appointments, and subsequent clinical follow-up at the private practice.</li>
      <li><strong>Consulting services / B2B:</strong> handling collaboration proposals, scientific consulting services, advisory boards or research projects for companies in the pharmaceutical and biotech sector.</li>
    </ul>
    <h2>3. Legal basis for processing</h2>
    <p>The legal basis for processing your data is:</p>
    <ul>
      <li>The user’s explicit consent when sending an enquiry by email or through a contact form.</li>
      <li>The performance of a contract, or steps prior to entering into a contract, for the provision of medical or consulting services.</li>
    </ul>
    <h2>4. Data retention</h2>
    <p>Personal data will be kept only for as long as strictly necessary to fulfil the purpose for which it was collected and to determine any liabilities that may arise from that purpose. Data relating to medical records will be kept for the periods required by healthcare regulations.</p>
    <h2>5. Disclosure of data to third parties</h2>
    <p>Personal data will not be disclosed to third parties, except where required by law or where essential for the proper provision of the service (for example, online appointment platforms or clinical laboratories, with your prior consent).</p>
    <h2>6. Your rights</h2>
    <p>Everyone has the right to obtain confirmation as to whether personal data concerning them is being processed. You may exercise your rights of:</p>
    <ul>
      <li>Access, rectification and erasure of your data.</li>
      <li>Restriction of or objection to processing.</li>
      <li>Data portability.</li>
    </ul>
    <p>To exercise these rights, please send a written request together with a copy of your identity document to: <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</p>
    <p>You also have the right to lodge a complaint with the Spanish Data Protection Agency (AEPD) at <a href="https://www.aepd.es/" target="_blank" rel="noopener">www.aepd.es</a> if you consider that the processing does not comply with the applicable regulations.</p>

fr:
  titulo: Politique de confidentialité
  eyebrow: Informations légales
  cuerpo: |
    <h2>1. Responsable du traitement</h2>
    <ul>
      <li><strong>Titulaire :</strong> Dr Marta Urech García de la Vega.</li>
      <li><strong>Adresse professionnelle :</strong> Calle Serrano 143, Madrid (Espagne).</li>
      <li><strong>E-mail de contact :</strong> <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</li>
    </ul>
    <h2>2. Finalités du traitement</h2>
    <p>Les données personnelles communiquées via les formulaires de contact, par e-mail ou par téléphone sont traitées pour les finalités suivantes :</p>
    <ul>
      <li><strong>Consultations médicales / Patients :</strong> gérer les demandes d’information et de rendez-vous, ainsi que le suivi clinique au cabinet privé.</li>
      <li><strong>Services de conseil / B2B :</strong> traiter les propositions de collaboration, les missions de conseil scientifique, les advisory boards ou les projets de recherche pour des entreprises du secteur pharmaceutique et biotechnologique.</li>
    </ul>
    <h2>3. Base juridique du traitement</h2>
    <p>La base juridique du traitement de vos données est :</p>
    <ul>
      <li>Le consentement explicite de l’utilisateur lorsqu’il envoie sa demande par e-mail ou via un formulaire de contact.</li>
      <li>L’exécution d’un contrat ou de mesures précontractuelles pour la prestation de services médicaux ou de conseil.</li>
    </ul>
    <h2>4. Durée de conservation</h2>
    <p>Les données personnelles sont conservées pendant la durée strictement nécessaire à la finalité pour laquelle elles ont été collectées et à la détermination des éventuelles responsabilités qui pourraient en découler. Les données relatives aux dossiers médicaux sont conservées selon les délais fixés par la réglementation sanitaire.</p>
    <h2>5. Communication des données à des tiers</h2>
    <p>Aucune donnée personnelle n’est communiquée à des tiers, sauf obligation légale ou lorsque cela est indispensable à la bonne prestation du service (par exemple, plateformes de prise de rendez-vous en ligne ou laboratoires d’analyses, avec votre accord préalable).</p>
    <h2>6. Vos droits</h2>
    <p>Toute personne a le droit d’obtenir la confirmation que des données personnelles la concernant sont ou non traitées. Vous pouvez exercer vos droits :</p>
    <ul>
      <li>D’accès, de rectification et d’effacement de vos données.</li>
      <li>De limitation du traitement ou d’opposition à celui-ci.</li>
      <li>À la portabilité des données.</li>
    </ul>
    <p>Pour exercer ces droits, envoyez une demande écrite accompagnée d’une copie de votre pièce d’identité à l’adresse : <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</p>
    <p>Vous avez également le droit d’introduire une réclamation auprès de l’Agence espagnole de protection des données (AEPD) sur <a href="https://www.aepd.es/" target="_blank" rel="noopener">www.aepd.es</a> si vous estimez que le traitement n’est pas conforme à la réglementation en vigueur.</p>

it:
  titulo: Informativa sulla privacy
  eyebrow: Informazioni legali
  cuerpo: |
    <h2>1. Titolare del trattamento</h2>
    <ul>
      <li><strong>Titolare:</strong> Dott.ssa Marta Urech García de la Vega.</li>
      <li><strong>Domicilio professionale:</strong> Calle Serrano 143, Madrid (Spagna).</li>
      <li><strong>Email di contatto:</strong> <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</li>
    </ul>
    <h2>2. Finalità del trattamento</h2>
    <p>I dati personali forniti tramite moduli di contatto, email o telefonate saranno trattati per le seguenti finalità:</p>
    <ul>
      <li><strong>Visite mediche / Pazienti:</strong> gestire le richieste di informazioni e di appuntamento e il successivo follow-up clinico presso lo studio privato.</li>
      <li><strong>Servizi di consulenza / B2B:</strong> gestire proposte di collaborazione, servizi di consulenza scientifica, advisory board o progetti di ricerca per aziende del settore farmaceutico e biotecnologico.</li>
    </ul>
    <h2>3. Base giuridica del trattamento</h2>
    <p>La base giuridica del trattamento dei dati è:</p>
    <ul>
      <li>Il consenso esplicito dell’utente al momento dell’invio della richiesta via email o tramite modulo di contatto.</li>
      <li>L’esecuzione di un contratto o di misure precontrattuali per la prestazione di servizi medici o di consulenza.</li>
    </ul>
    <h2>4. Conservazione dei dati</h2>
    <p>I dati personali saranno conservati per il tempo strettamente necessario a perseguire la finalità per cui sono stati raccolti e a determinare le eventuali responsabilità che ne possano derivare. I dati relativi alle cartelle cliniche saranno conservati secondo i termini previsti dalla normativa sanitaria.</p>
    <h2>5. Comunicazione dei dati a terzi</h2>
    <p>I dati personali non saranno comunicati a terzi, salvo obbligo di legge o quando ciò sia indispensabile per la corretta prestazione del servizio (ad esempio piattaforme di prenotazione online o laboratori di analisi, previo consenso dell’interessato).</p>
    <h2>6. Diritti dell’interessato</h2>
    <p>Chiunque ha il diritto di ottenere conferma che sia o meno in corso un trattamento di dati personali che lo riguardano. È possibile esercitare i diritti di:</p>
    <ul>
      <li>Accesso, rettifica e cancellazione dei dati.</li>
      <li>Limitazione del trattamento od opposizione allo stesso.</li>
      <li>Portabilità dei dati.</li>
    </ul>
    <p>Per esercitare tali diritti, è possibile inviare una richiesta scritta, insieme a una copia del documento d’identità, all’indirizzo email: <a href="mailto:contactoweb@urechderma.com">contactoweb@urechderma.com</a>.</p>
    <p>È inoltre possibile presentare reclamo all’Agenzia spagnola per la protezione dei dati (AEPD) su <a href="https://www.aepd.es/" target="_blank" rel="noopener">www.aepd.es</a> qualora si ritenga che il trattamento non sia conforme alla normativa vigente.</p>
