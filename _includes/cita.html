{% assign ui = site.data.i18n[page.lang] %}
<section class="cita" data-hex="izquierda" data-hex-pseudo="::after">
  <div class="wrap cita-inner">
    <div>
      <p class="eyebrow eyebrow-light">{{ ui.cita.eyebrow }}</p>
      <h2>{{ ui.cita.titulo }}</h2>
      <p>{{ ui.cita.texto }}</p>
    </div>
    <div class="cita-actions">
      <a class="btn btn-light" href="{{ site.contacto.citas_url }}" target="_blank" rel="noopener">{{ ui.reservar }}</a>
      <a class="btn btn-outline-light" href="tel:{{ site.contacto.telefono_enlace }}">{{ ui.llamar }} {{ site.contacto.telefono }}</a>
    </div>
  </div>
</section>
