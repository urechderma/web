<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Dra. Marta Urech, inicio">
      <span class="brand-name">Dra. Marta Urech</span>
      <span class="brand-tag">Dermatología</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="menu">
      <span class="sr-only">Menú</span>
      <span class="bars" aria-hidden="true"></span>
    </button>
    <nav id="menu" class="nav" aria-label="Principal">
      <ul>
        {% for item in site.menu %}
        {% assign prefijo = page.url | slice: 0, item.url.size %}
        <li><a href="{{ item.url | relative_url }}"{% if prefijo == item.url %} aria-current="page"{% endif %}>{{ item.titulo }}</a></li>
        {% endfor %}
      </ul>
      <a class="btn btn-small" href="{{ site.contacto.citas_url }}" target="_blank" rel="noopener">Pedir cita</a>
    </nav>
  </div>
</header>
